name: delete-branch

# 一次性工作流：删除指定的远端分支（本地 git 客户端受代理策略限制无法删除 ref）。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要删除的分支名'
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          set -euo pipefail
          if [ "$BRANCH" = "${{ github.event.repository.default_branch }}" ]; then
            echo "拒绝删除默认分支 $BRANCH"; exit 1
          fi
          gh api -X DELETE "/repos/${{ github.repository }}/git/refs/heads/$BRANCH"
          echo "已删除分支: $BRANCH"
          gh api "/repos/${{ github.repository }}/branches" --jq '.[].name'
