name: release

# 两种触发方式：
#   1) 推送 v* 标签自动发布；
#   2) 手动触发 (workflow_dispatch) 并填入版本号，由 gh 在服务端创建标签与 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本标签，例如 v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up JDK (编译内嵌卸载 agent)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Build agent.jar
        run: sh agent/build.sh

      - name: Test
        run: go test ./...

      - name: Resolve version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "发布版本: ${TAG}"

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          # 内存马排查工具面向 Linux（读取 /proc），发布 amd64 与 arm64 两个架构
          for target in linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/memcheck_${os}_${arch}"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$out" .
          done
          cd dist
          sha256sum memcheck_* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 去掉 YAML 块的 10 空格缩进，避免 markdown 把内容渲染成代码块
          sed 's/^          //' > notes.md <<EOF
          ## MemCheck ${TAG}

          内存马应急排查自动化工具 —— 依据《内存马应急排查手册 v2.0》实现的**只读**排查程序，
          一条命令完成 Java 进程/Agent、磁盘注入器、配置篡改、网络连接、JVM 运行时、
          日志与持久化的排查，输出带风险等级的报告。

          ### 特点
          - **零第三方依赖**：仅用 Go 标准库，单一静态二进制，适配 x86_64/ARM64 与断网环境。
          - **只读检测默认安全**：排查阶段不删除文件、不杀进程、不重启服务。
          - 原生读取 \`/proc\`、遍历文件系统、解析 \`/proc/net/tcp\`，不强依赖 ps/find/grep/netstat。

          ### 排查覆盖
          Java 进程/Agent 参数、磁盘注入器(可疑 JSP/class)、配置篡改(web.xml/server.xml/resin.xml)、
          网络连接、JVM 运行时(jstack/jmap)、日志、持久化(cron/systemd/启动脚本/SSH/SUID)，
          内置已知内存马特征库(冰蝎/哥斯拉/代理马)与框架白名单，报告按风险等级排序。

          ### 内存马热卸载（可选，需显式开启，仅 Linux）
          对应手册第四节「清除操作」的自动化版本：在**不重启服务**的前提下，从运行中的 JVM
          内存移除恶意 Filter/Servlet/Listener 注册（等价 Arthas OGNL 热清除）。
          - 卸载能力由自研 Java agent 经 \`go:embed\` **静态内嵌进单一二进制**，运行时以**纯 Go 实现的
            HotSpot attach 协议**（无 cgo）加载进目标 JVM，不依赖本地 JDK/Arthas。
          - **默认关闭**，必须显式 \`-remove\` 才有写操作；非交互环境不加 \`-yes\` 一律跳过。
          - 只在内存移除注册，**不删磁盘文件/不杀进程/不重启**；卸载后仍需删除磁盘注入器与篡改配置，否则会复活。

          ### 下载
          | 文件 | 平台 |
          |------|------|
          | \`memcheck_linux_amd64\` | Linux x86_64 |
          | \`memcheck_linux_arm64\` | Linux ARM64 |

          校验：\`sha256sum -c SHA256SUMS\`

          ### 使用
          \`\`\`bash
          chmod +x memcheck_linux_amd64
          sudo ./memcheck_linux_amd64                 # 自动排查（只读）
          sudo ./memcheck_linux_amd64 -root /opt/tomcat -days 7
          sudo ./memcheck_linux_amd64 -json -o result.json
          sudo ./memcheck_linux_amd64 -remove         # 扫描并交互式热卸载命中的内存马
          sudo ./memcheck_linux_amd64 -remove-class PlasmodesmaFilter -yes  # 定向卸载
          \`\`\`

          > 仅用于授权范围内的应急响应与安全演练。
          EOF
          # 若 Release 已存在则先删除（幂等，便于重跑）；标签由 gh 在服务端按需创建
          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${TAG}" \
            dist/memcheck_linux_amd64 \
            dist/memcheck_linux_arm64 \
            dist/SHA256SUMS \
            --target "${GITHUB_SHA}" \
            --title "MemCheck ${TAG}" \
            --notes-file notes.md
