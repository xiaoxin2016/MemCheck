name: release

# 打 v* 标签时自动构建多架构静态二进制并发布 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # 内存马排查工具面向 Linux（读取 /proc），发布 amd64 与 arm64 两个架构
          for target in linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/memcheck_${os}_${arch}"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$out" .
          done
          cd dist
          sha256sum memcheck_* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ## MemCheck ${{ github.ref_name }}

          内存马应急排查自动化工具 —— 依据《内存马应急排查手册 v2.0》实现的**只读**排查程序，
          一条命令完成 Java 进程/Agent、磁盘注入器、配置篡改、网络连接、JVM 运行时、
          日志与持久化的排查，输出带风险等级的报告。

          ### 特点
          - **零第三方依赖**：仅用 Go 标准库，单一静态二进制，适配 x86_64/ARM64 与断网环境。
          - **只读安全**：不删除文件、不杀进程、不重启服务，清除交由人工按手册处置。
          - 原生读取 `/proc`、遍历文件系统、解析 `/proc/net/tcp`，不强依赖 ps/find/grep/netstat。

          ### 下载
          | 文件 | 平台 |
          |------|------|
          | `memcheck_linux_amd64` | Linux x86_64 |
          | `memcheck_linux_arm64` | Linux ARM64 |

          校验：`sha256sum -c SHA256SUMS`

          ### 使用
          ```bash
          chmod +x memcheck_linux_amd64
          sudo ./memcheck_linux_amd64                 # 自动排查
          sudo ./memcheck_linux_amd64 -root /opt/tomcat -days 7
          sudo ./memcheck_linux_amd64 -json -o result.json
          ```

          > 仅用于授权范围内的应急响应与安全演练。
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            dist/memcheck_linux_amd64 \
            dist/memcheck_linux_arm64 \
            dist/SHA256SUMS \
            --title "MemCheck ${GITHUB_REF_NAME}" \
            --notes-file notes.md
