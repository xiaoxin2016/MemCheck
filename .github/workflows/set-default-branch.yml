name: set-default-branch

# 一次性工作流：把仓库默认分支切到指定分支（需要 administration:write）。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '设为默认的分支名'
        required: true
        default: 'main'

permissions:
  administration: write

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Set default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X PATCH "/repos/${{ github.repository }}" -f default_branch="${{ github.event.inputs.branch }}"
          echo "default_branch -> ${{ github.event.inputs.branch }}"
          gh api "/repos/${{ github.repository }}" --jq '.default_branch'
